<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduGuard UAE - AI Compliance Agent for Schools</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.6rem; } .sub { color: #555; margin-top: -0.8rem; }
  textarea, input { width: 100%; padding: 0.6rem; margin: 0.4rem 0; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
  button { background: #0b5fff; color: #fff; border: 0; padding: 0.7rem 1.4rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  button:disabled { background: #999; }
  .verdict { font-size: 1.3rem; font-weight: 700; padding: 0.8rem; border-radius: 8px; margin: 1rem 0; }
  .COMPLIANT { background: #e6f7e6; color: #146614; }
  .NEEDS_REVIEW { background: #fff7e0; color: #8a6d00; }
  .NON_COMPLIANT { background: #fde8e8; color: #a31212; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 0.8rem; margin: 0.6rem 0; }
  .cite { font-size: 0.85rem; color: #444; } .cite a { color: #0b5fff; }
  blockquote { border-left: 3px solid #0b5fff; margin: 0.5rem 0; padding: 0.3rem 0.8rem; background: #f5f8ff; font-size: 0.9rem; }
  .notice { font-size: 0.8rem; color: #777; margin-top: 2rem; }
  pre { background: #f4f4f4; padding: 0.8rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>EduGuard UAE</h1>
<p class="sub">Evidence-anchored AI compliance agent for UAE schools &mdash; ITU AI for Good Hackathon UAE</p>

<label><strong>Lesson plan / classroom AI use case</strong></label>
<textarea id="plan" rows="8" placeholder="Describe how AI will be used in the classroom...">Grade 10 mathematics: the teacher will use an AI chatbot to generate practice problems, and the AI will solely decide each student's final exam grade with no human review.</textarea>
<label><strong>Context (optional)</strong></label>
<input id="ctx" placeholder="e.g. Grade 10, public school, Dubai" value="Grade 10, public school, Dubai">
<p><button id="go" onclick="run()">Evaluate against policy</button></p>
<div id="out"></div>
<p class="notice">SIMULATION ONLY. All test data is synthetic. Every policy claim below is anchored to a verbatim citation from the knowledge base, or explicitly marked INSUFFICIENT_EVIDENCE.</p>

<script>
async function run() {
  const btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'Evaluating...';
  const out = document.getElementById('out'); out.innerHTML = '<p>Running retrieval, gap analysis, deterministic rules...</p>';
  try {
    const r = await fetch('/evaluate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ lesson_plan: document.getElementById('plan').value, context: document.getElementById('ctx').value })
    });
    const d = await r.json();
    if (!r.ok) { out.innerHTML = '<p style="color:red">Error: ' + (d.detail || r.status) + '</p>'; return; }
    let h = '<div class="verdict ' + d.verdict + '">Verdict: ' + d.verdict.replace(/_/g, ' ') + '</div>';
    h += '<p class="cite">' + d.evidence_note + '</p>';
    if (d.deterministic_rules_fired.length) {
      h += '<h3>Deterministic rules fired</h3>';
      d.deterministic_rules_fired.forEach(fr => {
        h += '<div class="card"><strong>' + fr.rule_id + ' [' + fr.severity + ']</strong><br>' + fr.title +
             '<br><span class="cite">Policy basis: <a href="' + fr.policy_basis.source_url + '" target="_blank">' + fr.policy_basis.title + '</a></span>' +
             '<br><em>' + fr.guidance + '</em></div>';
      });
    }
    if (d.advisory_gap_findings.length) {
      h += '<h3>Advisory gap findings</h3>';
      d.advisory_gap_findings.forEach(f => {
        h += '<div class="card"><strong>[' + f.type + ']</strong> ' + (f.summary || '') +
             (f.verbatim_quote ? '<blockquote>' + f.verbatim_quote + '</blockquote>' : '') +
             (f.source_url ? '<span class="cite">Source: <a href="' + f.source_url + '" target="_blank">' + (f.source_title || f.source_url) + '</a></span>' : '') + '</div>';
      });
    }
    h += '<h3>Recommended actions</h3><ul>' + d.recommended_actions.map(a => '<li>' + a + '</li>').join('') + '</ul>';
    h += '<h3>Knowledge-base citations</h3>';
    d.citations.forEach(c => {
      h += '<div class="card"><span class="cite"><a href="' + c.source_url + '" target="_blank">' + c.title + '</a> (' + c.chunk_id + ')</span><blockquote>' + c.verbatim_excerpt + '...</blockquote></div>';
    });
    h += '<p class="cite">Audit run: ' + d.audit_run_id + '</p>';
    out.innerHTML = h;
  } catch (e) { out.innerHTML = '<p style="color:red">Error: ' + e.message + '</p>'; }
  btn.disabled = false; btn.textContent = 'Evaluate against policy';
}
</script>
</body>
</html>
